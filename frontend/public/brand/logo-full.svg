<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect x="6" y="8" width="64" height="64" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#subtleDrop)"/>
  <circle cx="38" cy="40" r="22" stroke="#047857" stroke-width="2" stroke-opacity="0.25"/>
  <!-- Sleek minimalist compass needle with north diamond -->
  <polygon points="38,23 44,40 38,36" fill="url(#needleGrad)"/>
  <polygon points="38,23 32,40 38,36" fill="#10b981"/>
  <polygon points="38,57 44,40 38,44" fill="#cbd5e1"/>
  <polygon points="38,57 32,40 38,44" fill="#94a3b8"/>
  <circle cx="38" cy="40" r="3" fill="#ffffff" stroke="#047857" stroke-width="2"/>

  <!-- Wordmark in Space Grotesk styling -->
  <text x="86" y="44" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="24" fill="#0f172a" letter-spacing="-0.03em">Northwind</text>
  <text x="88" y="60" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600" font-size="11" fill="#047857" letter-spacing="0.22em">MARKET</text>
</svg>
